name: Morning Brief Dispatcher

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC = 07:30 IST (Asia/Kolkata)
    - cron: '0 2 * * *'

jobs:
  run-morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Deduplication Database Cache
        uses: actions/cache@v4
        with:
          path: morning_brief.db
          key: morning-brief-db-${{ github.ref_name }}-${{ runner.os }}
          restore-keys: |
            morning-brief-db-${{ github.ref_name }}-
            morning-brief-db-

      - name: Run Morning Brief Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.0-flash'
          TIMEZONE: 'Asia/Kolkata'
          DEDUPE_WINDOW_HOURS: '72'
        run: |
          python -m morning_brief.main run

      - name: Save Deduplication Database Cache
        if: always()
        uses: actions/cache@v4
        with:
          path: morning_brief.db
          key: morning-brief-db-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_number }}
